<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed the Gulper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&family=Rubik+Wet+Paint&display=swap">
<style>
  /* Full-bleed 3D bog; HUD pinned to top corners, shop bar along the bottom, cards float over the live scene. */
  :root {
    --bog: #0c181a;
    --bog-2: #15302f;
    --moss: #2d5a3b;
    --chloro: #9fd44c;
    --cilia: #e3f1b6;
    --maw: #e2425f;
    --pollen: #f4c44f;
    --mist: #d6e7dd;
    --mist-dim: #8fac9f;
    --font-display: "Rubik Wet Paint", Impact, "Arial Black", sans-serif;
    --font-body: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bog);
    color: var(--mist);
    font-family: var(--font-body);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0;
    pointer-events: none;
    text-shadow: 0 1px 6px rgba(0, 0, 0, .6);
  }
  .hud-block { display: grid; gap: 4px; min-width: 0; }
  .hud-right { justify-items: end; text-align: right; }
  .stage-name { font-family: var(--font-display); font-size: 1.6rem; line-height: 1; color: var(--chloro); text-wrap: balance; }
  .label { font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--mist-dim); }
  .data { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
  .mass { font-family: var(--font-data); font-weight: 700; font-size: 1.5rem; line-height: 1; color: var(--mist); font-variant-numeric: tabular-nums; }
  .meters { display: grid; gap: 6px; margin-top: 6px; }
  .meter-row { display: grid; grid-template-columns: 4.6rem 1fr; align-items: center; gap: 8px; }
  .meter { width: min(34vw, 180px); height: 9px; border-radius: 999px; background: color-mix(in srgb, var(--mist) 14%, transparent); overflow: hidden; }
  .meter-fill { height: 100%; width: 70%; background: var(--chloro); border-radius: inherit; transition: background-color .3s; }
  .meter-fill.hp { background: var(--cilia); }
  .meter-fill.low { background: var(--maw); }
  .war-tag {
    justify-self: start; margin-top: 4px; font-size: .7rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
    color: var(--bog); background: var(--maw); border-radius: 4px; padding: 3px 8px; text-shadow: none;
  }
  .coins { display: flex; align-items: center; gap: 6px; font-size: 1.15rem; font-weight: 700; color: var(--pollen); margin-top: 4px; }
  .coin { width: .8em; height: .8em; border-radius: 50%; background: var(--pollen); box-shadow: inset -2px -2px 0 rgba(0,0,0,.25); }
  .hud-btns { display: flex; gap: 6px; margin-top: 6px; pointer-events: auto; }
  .chip-btn {
    font: 600 .75rem var(--font-body); color: var(--mist);
    background: color-mix(in srgb, var(--bog-2) 80%, transparent);
    border: 1px solid var(--moss); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  .chip-btn:hover { border-color: var(--chloro); }
  button:focus-visible { outline: 2px solid var(--pollen); outline-offset: 2px; }

  .shop {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 8px; width: max-content; max-width: calc(100% - 32px);
  }
  .shop-btn {
    display: grid; grid-template-columns: auto auto; grid-template-areas: "name key" "cost cost";
    align-items: center; gap: 2px 10px; text-align: left; min-width: 0;
    font: 600 .85rem var(--font-body); color: var(--mist);
    background: color-mix(in srgb, var(--bog-2) 88%, transparent);
    border: 1px solid var(--moss); border-radius: 14px; padding: 8px 12px; cursor: pointer;
  }
  .shop-btn:hover:not(.cant) { border-color: var(--pollen); }
  .shop-btn .shop-name { grid-area: name; white-space: nowrap; }
  .shop-btn kbd { grid-area: key; justify-self: end; font: 500 .7rem var(--font-data); color: var(--mist-dim); border: 1px solid var(--moss); border-radius: 4px; padding: 0 4px; }
  .shop-btn .shop-cost { grid-area: cost; display: flex; align-items: center; gap: 5px; font-family: var(--font-data); font-size: .8rem; color: var(--pollen); }
  .shop-btn .shop-cost .coin { width: .7em; height: .7em; }
  .shop-btn.cant { opacity: .5; cursor: not-allowed; }
  .shop-btn.cant .shop-cost { color: var(--mist-dim); }

  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pop {
    position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
    font: 700 15px var(--font-data); color: var(--chloro);
    text-shadow: 0 0 4px var(--bog), 0 2px 0 var(--bog);
    animation: rise 1.2s ease-out forwards;
  }
  .pop.big { font-size: 19px; }
  .pop.gold { color: var(--pollen); }
  .pop.bad { color: var(--maw); }
  .pop.dim { color: var(--mist); }
  @keyframes rise { from { opacity: 1; margin-top: 0; } 70% { opacity: 1; } to { opacity: 0; margin-top: -46px; } }

  .banner {
    position: fixed; left: 0; right: 0; top: 24%; display: grid; justify-items: center; gap: 4px;
    padding: 0 16px; text-align: center; pointer-events: none;
    animation: bannerIn 2.6s ease-out forwards;
  }
  .banner-eyebrow { font-size: .78rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--pollen); }
  .banner-text {
    font-family: var(--font-display); font-size: clamp(2.4rem, 10vw, 4.4rem); line-height: 1; color: var(--chloro); text-wrap: balance;
    text-shadow: 0 4px 0 var(--bog), 0 0 24px rgba(0,0,0,.6);
  }
  .banner.war .banner-text { color: var(--maw); }
  .banner-sub { font-weight: 600; color: var(--mist); text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  @keyframes bannerIn {
    0% { opacity: 0; transform: scale(.85); }
    12% { opacity: 1; transform: scale(1); }
    78% { opacity: 1; }
    100% { opacity: 0; }
  }

  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    background: color-mix(in srgb, var(--bog) 55%, transparent);
    overflow-y: auto;
  }
  .card {
    width: 100%; max-width: 31rem;
    background: color-mix(in srgb, var(--bog-2) 94%, transparent);
    border: 1px solid var(--moss); border-radius: 20px;
    padding: 24px; display: grid; gap: 14px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
  }
  .card h1 {
    margin: 0; font-family: var(--font-display); font-weight: 400;
    font-size: clamp(3rem, 14vw, 4.6rem); line-height: .9; color: var(--chloro);
    text-wrap: balance; text-shadow: 0 4px 0 var(--moss);
  }
  .card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 2.4rem; line-height: 1; color: var(--chloro); text-wrap: balance; }
  .card p { margin: 0; line-height: 1.5; max-width: 62ch; }
  .eyebrow { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--pollen); font-weight: 600; }
  .controls { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .9rem; margin: 0; }
  .controls dt { color: var(--mist-dim); }
  .controls dd { margin: 0; }
  .ladder { display: grid; gap: 6px; font-size: .86rem; margin: 0; padding: 0; list-style: none; }
  .ladder li { display: grid; grid-template-columns: 4.2rem 1fr; gap: 10px; }
  .ladder b { font-family: var(--font-data); font-weight: 500; color: var(--pollen); font-variant-numeric: tabular-nums; }
  .fact { font-size: .85rem; color: var(--mist-dim); border-top: 1px solid var(--moss); padding-top: 12px; }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stats div { display: grid; gap: 2px; }
  .stats strong { font-family: var(--font-data); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .go {
    justify-self: start; font: 800 1rem var(--font-body); color: var(--bog);
    background: var(--chloro); border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer;
    box-shadow: 0 4px 0 var(--moss);
  }
  .go:hover { filter: brightness(1.08); }
  .go:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--moss); }
  @media (max-width: 520px) {
    .stage-name { font-size: 1.2rem; }
    .mass { font-size: 1.15rem; }
    .card { padding: 20px; }
    .shop { gap: 6px; }
    .shop-btn { padding: 6px 9px; font-size: .75rem; grid-template-columns: auto; grid-template-areas: "name" "cost"; }
    .shop-btn kbd { display: none; }
    .meter-row { grid-template-columns: 3.8rem 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pop, .banner { animation-duration: .01s; animation-delay: 0s; }
    .banner { animation: none; }
  }
</style>
</head>
<body>
<div class="hud">
  <div class="hud-block">
    <div class="stage-name" id="stageName">Seedling</div>
    <div class="label">Trap span <span class="data" id="span">1 cm</span></div>
    <div class="meters">
      <div class="meter-row"><span class="label">Fullness</span><div class="meter" role="meter" aria-label="Fullness" aria-valuemin="0" aria-valuemax="100" id="foodMeter"><div class="meter-fill" id="fullness"></div></div></div>
      <div class="meter-row"><span class="label">Health</span><div class="meter" role="meter" aria-label="Health" aria-valuemin="0" aria-valuemax="100" id="hpMeter"><div class="meter-fill hp" id="health"></div></div></div>
    </div>
    <div class="war-tag" id="warTag" hidden>At war with humans</div>
  </div>
  <div class="hud-block hud-right">
    <div class="mass" id="mass">0 mg</div>
    <div class="label">Digested</div>
    <div class="coins" aria-label="Coins"><span class="coin"></span><span class="data" id="coins">0</span></div>
    <div class="hud-btns">
      <button class="chip-btn" id="muteBtn" type="button">Sound on</button>
      <button class="chip-btn" id="pauseBtn" type="button">Pause</button>
    </div>
  </div>
</div>

<div class="shop" id="shop" hidden>
  <button class="shop-btn" id="buy-meal" type="button"><span class="shop-name">Free meal</span><kbd>1</kbd><span class="shop-cost"><span class="coin"></span><span id="cost-meal">12</span></span></button>
  <button class="shop-btn" id="buy-swarm" type="button"><span class="shop-name" id="name-swarm">Fly swarm</span><kbd>2</kbd><span class="shop-cost"><span class="coin"></span><span id="cost-swarm">35</span></span></button>
  <button class="shop-btn" id="buy-heal" type="button"><span class="shop-name">Regrow</span><kbd>3</kbd><span class="shop-cost"><span class="coin"></span><span id="cost-heal">25</span></span></button>
</div>

<div id="pops"></div>
<div class="banner" id="banner" hidden><div class="banner-eyebrow" id="bannerEyebrow"></div><div class="banner-text" id="bannerText"></div><div class="banner-sub" id="bannerSub"></div></div>
<div class="overlay" id="overlay"><div class="card" id="card"><p>Loading the bog…</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  function fail(msg) {
    $('card').innerHTML = '<div class="eyebrow">Can\'t start</div><h2>The bog didn\'t load</h2><p>' + msg + '</p>';
  }
  if (!window.THREE) { fail('Gulper needs the three.js 3D engine from cdnjs.cloudflare.com. Check your connection and reload the page.'); return; }
  const T = THREE;
  const V3 = T.Vector3;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Tuning ----------
  const STAGES = [
    { name: 'Seedling', at: 0, span: '1 cm' },
    { name: 'Snapper', at: 1e3, span: '4 cm' },
    { name: 'Bog Brute', at: 3e4, span: '30 cm' },
    { name: 'Greenhouse Menace', at: 1e6, span: '1.2 m', sub: 'Wasps and pebbles are snacks now' },
    { name: 'Leviathan', at: 2e7, span: '4 m', sub: 'Livestock is wandering in' },
    { name: 'Titan', at: 1e8, span: '9 m', sub: 'Humans have noticed you. They seem friendly, for now' },
    { name: 'Doom Bloom', at: 1e9, span: '20 m', sub: 'Army jeeps fit in your mouth now' },
    { name: 'World Eater', at: 1e10, span: '50 m', sub: 'Tanks fit in your mouth now' },
  ];
  const BIG = 3;        // stage where wasps and pebbles stop hurting
  const HUMAN_STAGE = 5; // 100 kg
  // mg: mass added to "digested". food: fullness restored. size: catch radius in world units.
  const PREY = {
    fly:     { mg: 12,    food: 6,   size: .09, speed: 1.7, stages: [0, 2], w: 10, kind: 'fly' },
    moth:    { mg: 90,    food: 9,   size: .14, speed: 1.1, stages: [0, 2], w: 6,  kind: 'fly' },
    wasp:    { mg: 150,   food: 6,   size: .12, speed: 1.9, stages: [0, 4], w: 2.5, kind: 'fly', danger: (s) => s < BIG, hurt: 25 },
    pebble:  { mg: 4e4,   food: 3,   size: .15, stages: [0, 4], w: 1.6, kind: 'thrown', danger: (s) => s < BIG, stun: 1.4 },
    beetle:  { mg: 1200,  food: 14,  size: .17, speed: .8,  stages: [1, 3], w: 5,  kind: 'fly' },
    golden:  { mg: 6000,  food: 25,  size: .12, speed: 2.5, stages: [1, 5], w: .7, kind: 'fly' },
    bat:     { mg: 2e4,   food: 28,  size: .35, speed: 1.4, stages: [2, 5], w: 4,  kind: 'fly' },
    steak:   { mg: 3e5,   food: 35,  size: .3,  stages: [2, 5], w: 2, kind: 'thrown' },
    pigeon:  { mg: 3.5e5, food: 38,  size: .42, speed: 1.5, stages: [3, 6], w: 4,  kind: 'fly' },
    duck:    { mg: 1.2e6, food: 42,  size: .55, speed: 1.6, stages: [3, 6], w: 3,  kind: 'fly' },
    goat:    { mg: 4e7,   food: 50,  size: .9,  speed: .8,  stages: [4, 7], w: 3,  kind: 'ground', cy: .95 },
    cow:     { mg: 6e8,   food: 60,  size: 1.5, speed: .6,  stages: [5, 7], w: 1.2, kind: 'ground', cy: 1.1, scale: 1.4 },
    tourist: { mg: 7e7,   food: 55,  size: .9,  speed: 1.3, stages: [5, 7], w: 5,  kind: 'ground', cy: 1.1, human: true },
    soldier: { mg: 8e7,   food: 55,  size: .9,  speed: 1.4, stages: [5, 7], w: 0,  kind: 'ground', cy: 1.1, human: true, war: true, gun: 'rifle' },
    jeep:    { mg: 2e9,   food: 70,  size: 2,   speed: 2.2, stages: [6, 7], w: 0,  kind: 'ground', cy: 1, war: true, gun: 'mg' },
    tank:    { mg: 4e10,  food: 100, size: 3,   speed: 1,   stages: [6, 7], w: 0,  kind: 'ground', cy: 1.3, war: true, gun: 'cannon', tooBig: (s) => s < 7 },
  };
  const GUNS = { rifle: { dmg: .8, speed: 60 }, mg: { dmg: .6, speed: 70 }, cannon: { dmg: 8, speed: 0 } };
  const SWARMS = ['fly', 'beetle', 'bat', 'pigeon', 'duck', 'tourist', 'tourist', 'tourist'];
  const SWARM_NAMES = ['Fly swarm', 'Beetle swarm', 'Bat swarm', 'Pigeon flock', 'Duck flock', 'Tour bus', 'Tour bus', 'Tour bus'];
  const SHOP = {
    meal: { cost: (s) => 12 * (1 + s) },
    swarm: { cost: (s) => 35 * (1 + s) },
    heal: { cost: (s) => 25 * (1 + s) },
  };

  const sOf = (stage) => Math.pow(1.55, stage);
  const reachOf = (s) => 2.4 * s;
  const camDistOf = (R) => R * 1.9 + 2;

  function fmt(mg) {
    if (mg < 1000) return Math.round(mg) + ' mg';
    const gr = mg / 1000;
    if (gr < 1000) return (gr < 10 ? gr.toFixed(1) : Math.round(gr)) + ' g';
    const kg = gr / 1000;
    if (kg < 1000) return (kg < 10 ? kg.toFixed(1) : Math.round(kg)) + ' kg';
    const t = kg / 1000;
    return (t < 10 ? t.toFixed(2) : t < 100 ? t.toFixed(1) : Math.round(t)) + ' t';
  }

  // ---------- Renderer, scene, camera ----------
  let renderer;
  try { renderer = new T.WebGLRenderer({ antialias: true }); } catch (e) { fail('Your browser has WebGL turned off, so the 3D scene can\'t be drawn.'); return; }
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.domElement.id = 'game';
  renderer.domElement.setAttribute('aria-label', 'Gulper 3D game area');
  document.body.prepend(renderer.domElement);

  const scene = new T.Scene();
  const HORIZON = '#29474a';
  const camera = new T.PerspectiveCamera(50, 1, .03, 4000);
  {
    const c = document.createElement('canvas'); c.width = 2; c.height = 256;
    const x = c.getContext('2d'); const gr = x.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#0a141c'); gr.addColorStop(.55, '#173037'); gr.addColorStop(1, HORIZON);
    x.fillStyle = gr; x.fillRect(0, 0, 2, 256);
    scene.background = new T.CanvasTexture(c);
  }
  scene.fog = new T.Fog(HORIZON, 10, 60);

  const hemi = new T.HemisphereLight('#b4d2c8', '#16261c', .75); scene.add(hemi);
  const sun = new T.DirectionalLight('#e8f0ff', .95);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0008;
  scene.add(sun); scene.add(sun.target);

  // Shared geometry and materials
  const GEO = {
    sphere: new T.SphereGeometry(1, 14, 10),
    dome: new T.SphereGeometry(1, 22, 10, 0, Math.PI * 2, 0, Math.PI / 2),
    box: new T.BoxGeometry(1, 1, 1),
    cyl: new T.CylinderGeometry(1, 1, 1, 10),
    cone: new T.ConeGeometry(1, 1, 10),
    plane: new T.PlaneGeometry(1, 1),
    rock: new T.DodecahedronGeometry(1, 0),
  };
  const matCache = {};
  function M(color, opts) {
    const key = color + (opts ? JSON.stringify(opts) : '');
    if (!matCache[key]) matCache[key] = new T.MeshStandardMaterial(Object.assign({ color, roughness: .7 }, opts || {}));
    return matCache[key];
  }
  function part(geo, mat, sx, sy, sz, x, y, z, parent) {
    const m = new T.Mesh(geo, mat);
    m.scale.set(sx, sy, sz); m.position.set(x || 0, y || 0, z || 0);
    m.castShadow = true;
    if (parent) parent.add(m);
    return m;
  }
  function canvasTex(w, h, draw) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    return new T.CanvasTexture(c);
  }
  const waspTex = canvasTex(64, 64, (x) => { for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? '#151515' : '#f4c44f'; x.fillRect(0, i * 8, 64, 8); } });
  const cowTex = canvasTex(128, 128, (x) => {
    x.fillStyle = '#f2efe6'; x.fillRect(0, 0, 128, 128); x.fillStyle = '#1d1d1d';
    for (let i = 0; i < 9; i++) { x.beginPath(); x.ellipse(Math.random() * 128, Math.random() * 128, 8 + Math.random() * 14, 6 + Math.random() * 10, Math.random() * 3, 0, Math.PI * 2); x.fill(); }
  });
  const ringTex = canvasTex(128, 128, (x) => { x.strokeStyle = '#fff'; x.lineWidth = 7; x.beginPath(); x.arc(64, 64, 56, 0, Math.PI * 2); x.stroke(); });
  const glowTex = canvasTex(128, 128, (x) => {
    const gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.35, 'rgba(255,255,255,.85)'); gr.addColorStop(.42, 'rgba(255,255,255,.25)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
  });
  const wingMat = M('#dfeaf2', { transparent: true, opacity: .45, side: T.DoubleSide, depthWrite: false });

  // ---------- Scenery ----------
  {
    const ground = new T.Mesh(new T.CircleGeometry(1200, 64), M('#14281e', { roughness: 1 }));
    ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

    const pool = M('#1f4049', { roughness: .15, metalness: .4 });
    for (let i = 0; i < 18; i++) {
      const r = 3 + Math.pow(Math.random(), 1.5) * 160, a = Math.random() * Math.PI * 2, s = 1 + Math.random() * (2 + r * .05);
      const m = new T.Mesh(new T.CircleGeometry(1, 28), pool);
      m.rotation.x = -Math.PI / 2; m.position.set(Math.sin(a) * r, .01, Math.cos(a) * r); m.scale.set(s, s * rand(.5, 1), 1); m.receiveShadow = true;
      scene.add(m);

  // ---------- Audio ----------
  let actx = null, muted = false, noiseBuf = null, lastShot = 0;
  function ensureAudio() {

    if (actx && actx.state === 'suspended') actx.resume();

  function tone(freq, dur, type, vol, slide, delay) {
    if (!actx || muted) return;

    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(gn).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  }
  function noise(dur, vol, freq) {
    if (!actx || muted) return;
    if (!noiseBuf) {
      noiseBuf = actx.createBuffer(1, actx.sampleRate * .7, actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = actx.currentTime;
    const src = actx.createBufferSource(); src.buffer = noiseBuf;
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const gn = actx.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.001, t + dur);
    src.connect(f).connect(gn).connect(actx.destination); src.start(t); src.stop(t + dur);
  }

      prey: [], shots: [], parts: [],
      spawnT: .4, combo: 0, lastCatch: -9, time: 0, shake: 0, hitFlash: 0,
      head: new V3(0, 1.4, .4), dir: new V3(0, .2, 1).normalize(),
      jaw: 'open', open: 1, jawT: 0, sCur: 1, sTarget: 1, sway: 0,
      war: false, humansEaten: 0, announcedHumans: false, snapQ: 0,
      camAng: 0, aimTarget: null, cause: '',
    };
    mouse.x = W / 2; mouse.y = H * .45;
  }

  const R = () => reachOf(g.sCur);
  const L = () => .5 * g.sCur;
  const mouthPos = () => g.head.clone().addScaledVector(g.dir, L() * .55);
  const catchR = () => .34 * g.sCur;
  function verdict(p) {
    const d = p.def;
    if (d.tooBig && d.tooBig(g.stage)) return 'big';
    if (d.danger && d.danger(g.stage)) return 'bad';
    return 'ok';
  }
  const centerOf = (p) => new V3(p.pos.x, p.pos.y + p.cy, p.pos.z);

  // ---------- Spawning ----------
  function spawnPrey(type, opts) {
    opts = opts || {};
    const def = PREY[type];
    const s = g.sTarget, Rr = reachOf(s), Dc = camDistOf(Rr);
    const vis = Math.max(1, Dc * (def.kind === 'ground' ? .007 : .011) / def.size);
    const built = BUILD[type]();
    const grp = built.root;
    const sc = vis * (def.kind === 'ground' ? (def.scale || 1) : def.size);
    grp.scale.setScalar(sc);
    const p = {
      type, def, grp, pos: grp.position, vel: new V3(), t: rand(0, 10), life: 0,
      r: def.size * vis, cy: (def.cy || 0) * sc, wings: built.wings || [], flap: built.flap || 20,
      legs: built.legs || [], arms: built.arms || [], gun: built.gun || null, hasCam: !!built.cam, spin: null,
    };
    const spdK = Math.pow(Rr / 2.4, def.kind === 'ground' ? .55 : .8);
    if (def.kind === 'fly') {
      if (opts.orbit) {
        const rad = rand(.4, .95) * Rr;
        p.orbit = { rad, ang: rand(0, Math.PI * 2), w: (Math.random() < .5 ? -1 : 1) * def.speed * spdK * .45 / rad, y: rand(.3, .9) * Rr, until: rand(12, 16) };
        p.pos.set(Math.sin(p.orbit.ang) * rad, p.orbit.y, Math.cos(p.orbit.ang) * rad);
      } else {
        const side = Math.random() < .5 ? -1 : 1;
        const a = g.camAng + side * Math.PI / 2 + rand(-.9, .9), Rs = Rr * 1.7 + 1.5;
        const y = Math.max(.3 * s, rand(.25, 1) * Rr);
        const start = new V3(Math.sin(a) * Rs, y, Math.cos(a) * Rs);
        const b = rand(0, Math.PI * 2), rr = rand(0, .6) * Rr;
        const dest = new V3(Math.sin(b) * rr, clamp(y + rand(-.25, .25) * Rr, .3 * s, Rr), Math.cos(b) * rr);
        p.vel.copy(dest.sub(start).normalize().multiplyScalar(def.speed * spdK * rand(.8, 1.2)));
        p.base = start.clone(); p.pos.copy(start);
        p.wob = { amp: p.r * rand(1, 4), f: rand(1.5, 4) };
      }
      p.maxLife = 30;
    } else if (def.kind === 'thrown') {
      const a = g.camAng + Math.PI + rand(-1, 1), Rs = Rr * 1.5 + 1;
      const p0 = new V3(Math.sin(a) * Rs, .2, Math.cos(a) * Rs);
      const p1 = new V3(-p0.x * rand(.6, 1.2) + rand(-.3, .3) * Rr, 0, -p0.z * rand(.6, 1.2) + rand(-.3, .3) * Rr);
      const tf = rand(2.2, 3), peak = rand(.45, 1) * Rr;
      p.G = 8 * peak / (tf * tf);
      p.vel.copy(p1.sub(p0).divideScalar(tf)); p.vel.y = p.G * tf / 2;
      p.pos.copy(p0);
      p.spin = new V3(rand(-6, 6), rand(-6, 6), rand(-6, 6));
      p.maxLife = tf + .5;
    } else {
      const a = (opts.angle !== undefined ? opts.angle : g.camAng + Math.PI + rand(-1.3, 1.3));
      const Rg = Rr * 2.3 + 6 + (opts.extra || 0);
      p.pos.set(Math.sin(a) * Rg, 0, Math.cos(a) * Rg);
      p.speed = def.speed * spdK * rand(.85, 1.15);
      p.spawnR = Rg;
      if (def.human || def.war) {
        const ranges = { tourist: opts.bus ? [.15, .6] : [.3, .95], soldier: [.5, 1.3], jeep: [.7, 1.5], tank: [.85, 1.6] };
        const rg = ranges[type];
        p.stand = rand(rg[0], rg[1]) * Rr;
        p.mode = 'approach';
        p.fireT = rand(1, 3); p.burst = 0;
        p.stay = rand(25, 40);
      } else {
        p.mode = 'cross';
        const perp = a + Math.PI / 2, off = rand(.15, .85) * Rr * (Math.random() < .5 ? -1 : 1);
        const via = new V3(Math.sin(perp) * off, 0, Math.cos(perp) * off);
        p.vel.copy(via.sub(p.pos).setY(0).normalize().multiplyScalar(p.speed));
      }
      p.maxLife = 160;
    }
    scene.add(grp);
    g.prey.push(p);
    return p;
  }

  function spawnTick() {
    const st = g.stage;
    const ground = g.prey.filter((p) => p.def.kind === 'ground').length;
    if (g.prey.length > 70) return;
    const pool = [];
    for (const [k, d] of Object.entries(PREY)) {
      if (st < d.stages[0] || st > d.stages[1]) continue;
      let w = d.w;
      if (k === 'wasp' && st < BIG) w += st * .8;
      if (g.war) {
        if (k === 'soldier') w = 6;
        if (k === 'jeep' && st >= 6) w = 2;
        if (k === 'tank' && st >= 6) w = 1.3;
        if (k === 'tourist') w = 1.5;
      }
      if (d.kind === 'ground' && ground >= (g.war ? 16 : 14)) w = 0;
      if (w > 0) pool.push([k, w]);
    }
    if (!pool.length) return;
    let roll = Math.random() * pool.reduce((a, b) => a + b[1], 0), i = 0;
    while (roll > pool[i][1]) { roll -= pool[i][1]; i++; }
    const type = pool[i][0];
    if (type === 'soldier') {
      const a = g.camAng + Math.PI + rand(-1.2, 1.2), n = 2 + Math.floor(Math.random() * 2);
      for (let j = 0; j < n; j++) spawnPrey('soldier', { angle: a + rand(-.12, .12), extra: j * 1.5 });
    } else spawnPrey(type);
  }

  function removePrey(p) { p.dead = true; scene.remove(p.grp); }

  // ---------- Combat ----------
  function plantTarget() {
    const r = Math.random();
    if (r < .45) return g.head.clone();
    if (r < .85 && stalkCurve) return stalkCurve.getPoint(rand(.3, .8));
    return new V3(rand(-.3, .3) * g.sCur, .2 * g.sCur, rand(-.3, .3) * g.sCur);
  }
  function fire(p) {
    const gun = GUNS[p.def.gun];
    const from = new V3(); p.gun.getWorldPosition(from);
    const to = plantTarget();
    const dist = from.distanceTo(to);
    const cannon = p.def.gun === 'cannon';
    const shotSize = Math.max(.05, camDistOf(R()) * .004);
    const m = new T.Mesh(partGeo, pmat(cannon ? '#ffb347' : '#ffe08a', true));
    m.scale.set(shotSize * (cannon ? 2.5 : 1), shotSize * (cannon ? 2.5 : 1), shotSize * (cannon ? 2.5 : 5));
    m.position.copy(from); scene.add(m);
    const dur = cannon ? 1.1 : clamp(dist / (gun.speed * Math.pow(R() / 21, .5)), .12, .8);
    g.shots.push({ m, from, to, t: 0, dur, dmg: gun.dmg, cannon, arc: cannon ? dist * .25 : 0 });
    flash(from, '#fff1b8', shotSize * (cannon ? 6 : 3), .06);
    if (cannon) sfx.boom(); else sfx.shot();
  }
  function hurt(amount, where, label, cause) {
    if (state !== 'playing') return;
    g.hp -= amount; g.hitFlash = .25;
    if (label) pop(where, label, 'bad big');
    if (g.hp <= 0) { g.hp = 0; gameOver(cause); }
  }

  // ---------- Snapping ----------
  function trySnap() {
    if (g.jaw !== 'open' || g.open < .6) return;
    g.jaw = 'snapping'; g.jawT = 0; sfx.snap();
  }
  function resolveSnap() {
    const m = mouthPos(), cr = catchR();
    let caught = g.prey.filter((p) => !p.dead && centerOf(p).distanceTo(m) < cr + p.r * .6);
    if (!caught.length) { g.jaw = 'cooldown'; g.jawT = .28; g.combo = 0; return; }
    const tooBig = caught.filter((p) => verdict(p) === 'big');
    if (tooBig.length) {
      sfx.clank(); g.shake = .3; g.combo = 0; g.jaw = 'stunned'; g.jawT = 1;
      pop(m, 'Too big to swallow yet', 'dim big');
      return;
    }
    let bad = null, chew = 0, gained = 0, coins = 0, goods = 0, humans = 0, crunchy = false;
    for (const p of caught) {
      removePrey(p);
      const v = verdict(p);
      if (v === 'bad') { if (bad !== 'wasp') bad = p.type; continue; }
      goods++;
      if (p.def.danger) crunchy = true;
      if (p.def.human) humans++;
    }
    if (goods) {
      g.combo = g.time - g.lastCatch < 2.5 ? Math.min(5, g.combo + 1) : 1;
      g.lastCatch = g.time;
      for (const p of caught) {
        if (verdict(p) === 'bad') continue;
        gained += p.def.mg * g.combo;
        g.food = Math.min(100, g.food + p.def.food);
        g.hp = Math.min(100, g.hp + p.def.food * .2);
        coins += Math.max(1, Math.round(p.def.food / 3 * (1 + g.stage * .35))) * g.combo;
        chew = Math.max(chew, clamp(p.def.food / 60, .2, 1.3));
      }
      g.mass += gained; g.coins += coins; g.earned += coins;
      g.humansEaten += humans;
      pop(m, '+' + fmt(gained) + (g.combo > 1 ? '  ×' + g.combo : ''), g.combo > 1 ? 'gold big' : (g.combo > 2 ? 'big' : ''));
      setTimeout(() => state === 'playing' && pop(m.clone().add(new V3(0, -catchR(), 0)), '+' + coins + ' coins', 'gold'), 160);
      burst(m, crunchy ? '#9a9f9b' : '#9fd44c', 10 + goods * 4, .03 * g.sCur, 2.2 * g.sCur);
      crunchy ? sfx.crunch() : sfx.chomp();
      checkStage();
      checkWar();
    }
    if (bad === 'wasp') {
      burst(m, '#f4c44f', 12, .025 * g.sCur, 2 * g.sCur);
      sfx.sting(); g.combo = 0; g.shake = .4;
      g.jaw = 'stunned'; g.jawT = .8;
      hurt(PREY.wasp.hurt, m, 'Stung!', 'sting');
    } else if (bad === 'pebble') {
      sfx.clank(); g.food = Math.max(0, g.food - 8); g.shake = .3; g.combo = 0;
      g.jaw = 'stunned'; g.jawT = PREY.pebble.stun;
      pop(m, 'Pebble! Jaws stunned', 'dim big');
    } else if (g.jaw === 'snapping') {
      g.jaw = 'chewing'; g.jawT = chew;
    }
  }

  function checkStage() {
    while (g.stage < STAGES.length - 1 && g.mass >= STAGES[g.stage + 1].at) {
      g.stage++;
      g.sTarget = sOf(g.stage);
      g.hp = Math.min(100, g.hp + 35);
      const st = STAGES[g.stage];
      banner('It grew · ' + st.span + ' trap', st.name, st.sub, false, true);
      sfx.grow();
    }
  }
  function checkWar() {
    if (g.war || g.stage < HUMAN_STAGE) return;
    if (g.humansEaten >= 4 || g.mass >= 4e8) {
      g.war = true;
      banner('You ate ' + g.humansEaten + (g.humansEaten === 1 ? ' human' : ' humans'), 'The humans declared war', 'Soldiers are coming. Eat them before they cut you down.', true);
      sfx.siren();
      for (const p of g.prey) if (p.type === 'tourist') { p.mode = 'flee'; p.speed *= 1.8; }
      const a = g.camAng + Math.PI;
      for (let j = 0; j < 4; j++) spawnPrey('soldier', { angle: a + rand(-.4, .4), extra: j });
    }
  }

  // ---------- Shop ----------
  function buy(id) {
    if (state !== 'playing') return;
    const cost = SHOP[id].cost(g.stage);
    const where = mouthPos();
    if (g.coins < cost) { pop(where, 'Need ' + (cost - g.coins) + ' more coins', 'dim'); return; }
    g.coins -= cost; sfx.coin();
    if (id === 'meal') {
      g.food = Math.min(100, g.food + 60);
      g.jaw = 'chewing'; g.jawT = .6; g.open = 0;
      burst(where, '#b8323f', 16, .03 * g.sCur, 2 * g.sCur);
      pop(where, 'Free meal · +60 fullness', 'gold big');
      sfx.chomp();
    } else if (id === 'swarm') {
      const type = SWARMS[g.stage];
      if (PREY[type].kind === 'ground') {
        const a = g.camAng + Math.PI + rand(-.8, .8);
        for (let j = 0; j < 10; j++) spawnPrey(type, { bus: true, angle: a + rand(-.15, .15), extra: j * .8 });
        pop(where, 'A tour bus is pulling up', 'gold big');
      } else {
        for (let j = 0; j < 18; j++) spawnPrey(type, { orbit: true });
        pop(where, SWARM_NAMES[g.stage] + ' incoming', 'gold big');
      }
    } else if (id === 'heal') {
      g.hp = Math.min(100, g.hp + 50);
      burst(g.head, '#e3f1b6', 14, .03 * g.sCur, 1.6 * g.sCur);
      pop(where, 'Regrown · +50 health', 'gold big');
    }
  }

  // ---------- Update ----------
  function aimPoint(live) {
    const Rr = R();
    if (!live) {
      const t = g.time;
      g.aimTarget = null;
      return new V3(Math.sin(t * .6) * Rr * .6, Rr * (.55 + .15 * Math.sin(t * 1.1)), Math.cos(t * .4) * Rr * .3);
    }
    // Aim assist: lock onto the prey closest to the cursor on screen
    const fovK = (H / 2) / Math.tan(camera.fov * Math.PI / 360);
    let bestP = null, bd = Infinity;
    for (const p of g.prey) {
      if (p.dead) continue;
      const c = centerOf(p);
      if (Math.hypot(c.x, c.z) > Rr * 1.25) continue;
      const s = toScreen(c);
      if (!s.ok) continue;
      const rpx = p.r / Math.max(.01, camera.position.distanceTo(c)) * fovK;
      const d = Math.hypot(s.x - mouse.x, s.y - mouse.y);
      if (d < 42 + rpx && d < bd) { bd = d; bestP = p; }
    }
    g.aimTarget = bestP;
    if (bestP) return centerOf(bestP);
    // Otherwise aim at the cursor on a camera-facing plane through the plant, or on the ground
    const ndc = new T.Vector2(mouse.x / W * 2 - 1, -(mouse.y / H) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const n = new V3(camera.position.x, 0, camera.position.z).normalize();
    const plane = new T.Plane(n, 0);
    const hit = new V3();
    if (ray.ray.intersectPlane(plane, hit)) {
      if (hit.y < 0) { ray.ray.intersectPlane(new T.Plane(new V3(0, 1, 0), 0), hit); hit.y = .3 * g.sCur; }
      return hit;
    }
    return new V3(0, Rr * .6, 0);
  }

  function updatePlant(dt, live) {
    const s = g.sCur, Rr = R();
    const aim = aimPoint(live);
    // head goes where the mouth can reach the aim point
    const baseTop = new V3(0, .15 * s, 0);
    const toAim = aim.clone().sub(baseTop);
    const want = toAim.clone().normalize();
    const headT = aim.clone().addScaledVector(want, -L() * .55);
    const v = headT.sub(baseTop);
    const len = v.length();
    if (len > Rr) v.multiplyScalar(Rr / len);
    if (len < .6 * s) v.setLength(.6 * s);
    const ht = baseTop.clone().add(v);
    ht.y = Math.max(.28 * s, ht.y);
    const k = Math.min(1, dt * (g.jaw === 'stunned' ? 2.5 : 9));
    g.head.lerp(ht, k);
    const d = aim.clone().sub(g.head);
    if (d.length() > .05 * s) {
      d.normalize(); d.y = clamp(d.y, -.85, .9); d.normalize();
      g.dir.lerp(d, Math.min(1, dt * 8)).normalize();
    }

    if (live && g.snapQ > 0) {
      g.snapQ -= dt;
      if (g.head.distanceTo(ht) < .08 * s || g.snapQ <= 0) { g.snapQ = 0; trySnap(); }
    }
    switch (g.jaw) {
      case 'open': g.open = Math.min(1, g.open + dt * 6); break;
      case 'snapping':
        g.jawT += dt; g.open = Math.max(0, 1 - g.jawT / .08);
        if (g.jawT >= .08) { if (live) resolveSnap(); else { g.jaw = 'cooldown'; g.jawT = .3; } }
        break;
      default:
        g.jawT -= dt;
        g.open = g.jaw === 'stunned' ? .3 + Math.sin(g.time * 22) * .08 : 0;
        if (g.jawT <= 0) g.jaw = 'open';
    }
  }

  function updatePrey(dt, live) {
    const Rr = R();
    for (const p of g.prey) {
      if (p.dead) continue;
      p.t += dt; p.life += dt;
      const d = p.def;
      for (const w of p.wings) w.rotation.z = w.userData.sd * Math.sin(p.t * p.flap) * .9;
      if (d.kind === 'fly') {
        if (p.orbit) {
          p.orbit.ang += p.orbit.w * dt;
          if (p.life > p.orbit.until) p.orbit.rad += Rr * .5 * dt;
          const prev = p.pos.clone();
          p.pos.set(Math.sin(p.orbit.ang) * p.orbit.rad, p.orbit.y + Math.sin(p.t * 2) * p.r * 2, Math.cos(p.orbit.ang) * p.orbit.rad);
          p.grp.lookAt(p.pos.clone().add(p.pos.clone().sub(prev)));
          if (p.orbit.rad > Rr * 2.5) removePrey(p);
        } else {
          p.base.addScaledVector(p.vel, dt);
          if (p.type === 'fly' || p.type === 'golden') { p.base.y += Math.sin(p.t * 7) * p.r * 3 * dt; }
          p.pos.copy(p.base); p.pos.y += Math.sin(p.t * p.wob.f) * p.wob.amp;
          p.grp.lookAt(p.pos.clone().add(p.vel));
          if (p.life > 3 && Math.hypot(p.pos.x, p.pos.z) > Rr * 2.2 + 2) removePrey(p);
        }
      } else if (d.kind === 'thrown') {
        p.vel.y -= p.G * dt;
        p.pos.addScaledVector(p.vel, dt);
        p.grp.rotation.x += p.spin.x * dt; p.grp.rotation.y += p.spin.y * dt;
        if (p.pos.y < -1) removePrey(p);
      } else {
        updateWalker(p, dt, live, Rr);
      }
      if (!p.dead && p.life > p.maxLife) removePrey(p);
    }
    g.prey = g.prey.filter((p) => !p.dead);
  }

  function updateWalker(p, dt, live, Rr) {
    const dist = Math.hypot(p.pos.x, p.pos.z);
    let moving = true;
    const toward = new V3(-p.pos.x, 0, -p.pos.z).normalize();
    if (p.mode === 'cross') {
      p.pos.addScaledVector(p.vel, dt);
      p.grp.rotation.y = Math.atan2(p.vel.x, p.vel.z);
      if (p.life > 4 && dist > p.spawnR * 1.05) removePrey(p);
    } else if (p.mode === 'approach') {
      p.pos.addScaledVector(toward, p.speed * dt);
      p.grp.rotation.y = Math.atan2(toward.x, toward.z);
      if (dist <= p.stand) { p.mode = 'hold'; p.wanderT = 0; }
    } else if (p.mode === 'hold') {
      if (p.type === 'tourist') {
        p.wanderT -= dt;
        if (p.wanderT <= 0) { p.wanderT = rand(2, 4); p.wdir = rand(0, Math.PI * 2); p.walking = Math.random() < .5; }
        if (p.walking) {
          const wv = new V3(Math.sin(p.wdir), 0, Math.cos(p.wdir));
          p.pos.addScaledVector(wv, p.speed * .35 * dt);
          p.grp.rotation.y = p.wdir;
        } else { moving = false; p.grp.rotation.y = Math.atan2(toward.x, toward.z); }
        if (p.hasCam && Math.random() < dt * .25) {
          const c = new V3(0, 1.5, .3).applyMatrix4(p.grp.matrixWorld);
          flash(c, '#ffffff', .35, .1);
        }
        p.stay -= dt;
        if (p.stay <= 0) { p.mode = 'flee'; }
      } else {
        moving = false;
        p.grp.rotation.y = Math.atan2(toward.x, toward.z);
        if (live && g.war && p.gun) {
          p.fireT -= dt;
          if (p.fireT <= 0) {
            fire(p);
            if (p.def.gun === 'mg') { if (p.burst > 0) { p.burst--; p.fireT = .13; } else { p.burst = 5; p.fireT = rand(2, 3.5); } }
            else p.fireT = p.def.gun === 'cannon' ? rand(4, 6) : rand(2, 4);
          }
        }
      }
    } else if (p.mode === 'flee') {
      p.pos.addScaledVector(toward, -p.speed * dt);
      p.grp.rotation.y = Math.atan2(-toward.x, -toward.z);
      if (dist > p.spawnR * 1.05) removePrey(p);
    }
    const sw = moving ? Math.sin(p.t * 9) * .6 : 0;
    p.legs.forEach((l, i) => { l.rotation.x = (i % 2 ? 1 : -1) * sw; });
    if (p.type === 'tourist') p.arms.forEach((a, i) => { a.rotation.x = (i % 2 ? -1 : 1) * sw * .8; });
    if (moving && (p.type === 'jeep' || p.type === 'tank')) p.grp.position.y = Math.abs(Math.sin(p.t * 14)) * .04;
  }

  function updateShots(dt) {
    for (const s of g.shots) {
      s.t += dt;
      const u = Math.min(1, s.t / s.dur);
      s.m.position.lerpVectors(s.from, s.to, u);
      if (s.arc) s.m.position.y += Math.sin(Math.PI * u) * s.arc;
      s.m.lookAt(s.to);
      if (u >= 1) {
        s.done = true; scene.remove(s.m);
        if (s.cannon) { burst(s.to, '#ff9a3c', 14, .05 * g.sCur, 2.5 * g.sCur, true); burst(s.to, '#555', 8, .06 * g.sCur, 1.2 * g.sCur); g.shake = Math.max(g.shake, .35); }
        else burst(s.to, '#ffe08a', 3, .015 * g.sCur, 1.5 * g.sCur, true);
        hurt(s.dmg, s.to, s.cannon ? '-' + s.dmg + ' shell' : null, 'war');
      }
    }
    g.shots = g.shots.filter((s) => !s.done);
  }

  function update(dt, live) {
    g.time += dt;
    g.sCur += (g.sTarget - g.sCur) * Math.min(1, dt * 1.5);
    g.sway = Math.sin(g.time * 1.3) * .15 * g.sCur;

    if (live) {
      const kv = 650 * dt;
      if (keys.ArrowLeft || keys.a) mouse.x -= kv;
      if (keys.ArrowRight || keys.d) mouse.x += kv;
      if (keys.ArrowUp || keys.w) mouse.y -= kv;
      if (keys.ArrowDown || keys.s) mouse.y += kv;
      mouse.x = clamp(mouse.x, 0, W); mouse.y = clamp(mouse.y, 0, H);
      if (keys.q) g.camAng -= dt * 1.2;
      if (keys.e) g.camAng += dt * 1.2;
    } else g.camAng += dt * .08;

    updatePlant(dt, live);

    if (live) {
      g.food -= (2.4 + g.stage * .5) * (1 + g.time / 400) * dt;
      if (g.food <= 0) { g.food = 0; hurt(7 * dt, null, null, 'starve'); }
      if (!g.announcedHumans && g.stage >= HUMAN_STAGE) g.announcedHumans = true;
    }
    g.spawnT -= dt;
    if (g.spawnT <= 0) { spawnTick(); g.spawnT = Math.max(.35, 1 - g.stage * .06) * rand(.6, 1.4); }
    updatePrey(dt, live);
    updateShots(dt);

    for (const p of g.parts) {
      p.t += dt; p.v.y -= p.grav * dt;
      p.m.position.addScaledVector(p.v, dt);
      p.m.scale.setScalar(p.s0 * (1 - p.t / p.life * .6));
      if (p.t >= p.life) { p.done = true; scene.remove(p.m); }
    }
    g.parts = g.parts.filter((p) => !p.done);
    g.shake = Math.max(0, g.shake - dt);
    g.hitFlash = Math.max(0, g.hitFlash - dt);
  }

  // ---------- Render ----------
  const tmpCol = new T.Color();
  function syncScene() {
    const s = g.sCur, Rr = R();
    plantBase.scale.setScalar(s);
    head.position.copy(g.head);
    head.scale.setScalar(s);
    head.up.set(0, 1, 0);
    head.lookAt(g.head.clone().add(g.dir));
    const op = g.open * .75 + (g.jaw === 'chewing' ? Math.abs(Math.sin(g.time * 16)) * .08 : 0);
    hingeU.rotation.x = -op; hingeL.rotation.x = op;

    const p0 = new V3(0, .1 * s, 0);
    const p3 = g.head.clone().addScaledVector(g.dir, -.04 * s);
    const p1 = new V3(g.sway, g.head.y * .45, g.sway * .5);
    const p2 = p3.clone().addScaledVector(g.dir, -L() * 1.2);
    stalkCurve = new T.CubicBezierCurve3(p0, p1, p2, p3);
    stalk.geometry.dispose();
    stalk.geometry = new T.TubeGeometry(stalkCurve, 28, .065 * s, 8, false);

    // Health shows in the plant: it browns as it gets hurt and flashes red when hit
    const wilt = (1 - g.hp / 100) * .75;
    matLobe.color.copy(GREEN.lobe).lerp(BROWN, wilt);
    matStalk.color.copy(GREEN.stalk).lerp(BROWN, wilt);
    matLeaf.color.copy(GREEN.leaf).lerp(BROWN, wilt);
    matLobe.emissive.setRGB(g.hitFlash * 2, 0, 0);
    matStalk.emissive.setRGB(g.hitFlash * 1.5, 0, 0);

    const m = mouthPos(), cr = catchR();
    zoneRing.visible = g.jaw === 'open' && state === 'playing';
    zoneRing.position.copy(m); zoneRing.scale.setScalar(cr * 2.2);
    const tgt = g.aimTarget && !g.aimTarget.dead ? g.aimTarget : null;
    lockRing.visible = !!tgt && state === 'playing';
    if (tgt) {
      lockRing.position.copy(centerOf(tgt));
      lockRing.scale.setScalar(Math.max(tgt.r * 3, cr * .8));
      const v = verdict(tgt);
      lockRing.material.color.set(v === 'ok' ? '#f4c44f' : v === 'bad' ? '#e2425f' : '#8fac9f');
    }

    // Camera pulls back as the plant grows
    const D = camDistOf(Rr), h = Rr * .62 + .5;
    const sh = g.shake > 0 && !reduceMotion ? g.shake * .06 * Rr : 0;
    camera.position.set(Math.sin(g.camAng) * D + rand(-sh, sh), h + rand(-sh, sh), Math.cos(g.camAng) * D);
    camera.lookAt(0, Rr * .42, 0);
    scene.fog.near = D * .9; scene.fog.far = D * 3.6 + 40;
    moon.position.copy(camera.position).add(new V3(-Math.sin(g.camAng + .6), .38, -Math.cos(g.camAng + .6)).normalize().multiplyScalar(1500));
    sun.position.set(Rr * 1.2 + 3, Rr * 2.4 + 6, Rr * .6 + 2);
    const sc = sun.shadow.camera, ext = Rr * 2.6 + 4;
    if (Math.abs(sc.right - ext) > .5) {
      sc.left = -ext; sc.right = ext; sc.top = ext; sc.bottom = -ext; sc.near = .5; sc.far = Rr * 8 + 40;
      sc.updateProjectionMatrix();
    }
  }

  // ---------- HUD and screens ----------
  const hud = {
    stage: $('stageName'), span: $('span'), food: $('fullness'), foodM: $('foodMeter'), hp: $('health'), hpM: $('hpMeter'),
    mass: $('mass'), coins: $('coins'), war: $('warTag'),
  };
  const shopEls = {
    meal: { btn: $('buy-meal'), cost: $('cost-meal') },
    swarm: { btn: $('buy-swarm'), cost: $('cost-swarm'), name: $('name-swarm') },
    heal: { btn: $('buy-heal'), cost: $('cost-heal') },
  };
  const last = {};
  function setIf(key, val, fn) { if (last[key] !== val) { last[key] = val; fn(val); } }
  function updateHUD() {
    const st = STAGES[g.stage];
    setIf('stage', g.stage, () => {
      hud.stage.textContent = st.name; hud.span.textContent = st.span;
      shopEls.swarm.name.textContent = SWARM_NAMES[g.stage];
    });
    setIf('food', Math.round(g.food), (f) => { hud.food.style.width = f + '%'; hud.food.classList.toggle('low', f < 25); hud.foodM.setAttribute('aria-valuenow', f); });
    setIf('hp', Math.round(g.hp), (f) => { hud.hp.style.width = f + '%'; hud.hp.classList.toggle('low', f < 30); hud.hpM.setAttribute('aria-valuenow', f); });
    setIf('mass', fmt(g.mass), (m) => { hud.mass.textContent = m; });
    setIf('coins', g.coins, (c) => { hud.coins.textContent = c.toLocaleString('en-US'); });
    setIf('war', g.war, (w) => { hud.war.hidden = !w; });
    for (const id of Object.keys(SHOP)) {
      const cost = SHOP[id].cost(g.stage);
      setIf('cost-' + id, cost, (c) => { shopEls[id].cost.textContent = c.toLocaleString('en-US'); });
      setIf('can-' + id, g.coins >= cost, (ok) => { shopEls[id].btn.classList.toggle('cant', !ok); shopEls[id].btn.setAttribute('aria-disabled', String(!ok)); });
    }
  }

  const overlay = $('overlay'), card = $('card'), shopEl = $('shop');
  function show(html, onGo) {
    card.innerHTML = html;
    overlay.hidden = false;
    shopEl.hidden = true;
    const btn = card.querySelector('.go');
    if (btn) { btn.addEventListener('click', onGo); btn.focus({ preventScroll: true }); }
  }

  function titleScreen() {
    state = 'title';
    show(`
      <div class="eyebrow">Dionaea muscipula, but enormous</div>
      <h1>Gulper</h1>
      <p>Your Venus flytrap is hungry, and every meal makes it bigger. Snap up anything that flies, falls or wanders past, earn coins for every bite, and keep growing until the humans come for you.</p>
      <dl class="controls">
        <dt>Aim</dt><dd>Mouse, drag a finger, or arrow keys. The trap locks onto prey near your cursor.</dd>
        <dt>Snap</dt><dd>Click, tap, or Space</dd>
        <dt>Shop</dt><dd>Buttons along the bottom, or keys 1, 2, 3</dd>
        <dt>Camera</dt><dd>Q and E turn around the plant</dd>
      </dl>
      <ul class="ladder">
        <li><b>0 mg</b><span>Flies and moths. Wasps sting and pebbles stun.</span></li>
        <li><b>1 kg</b><span>Big enough that wasps and pebbles are just snacks.</span></li>
        <li><b>100 kg</b><span>Tourists arrive to take photos. They're edible.</span></li>
        <li><b>Later</b><span>Eat too many and the humans declare war: rifles, jeeps, then tanks.</span></li>
      </ul>
      <p class="fact">A real flytrap only shuts after two trigger hairs are brushed within about 20 seconds, so a raindrop can't fool it. The Gulper is less careful.</p>
      <button class="go" type="button">Start feeding</button>
    `, startGame);
  }

  function startGame() {
    ensureAudio();
    newGame();
    for (const k in last) delete last[k];
    state = 'playing';
    overlay.hidden = true;
    shopEl.hidden = false;
    $('pauseBtn').textContent = 'Pause';
  }
  function pause() {
    if (state !== 'playing') return;
    state = 'paused';
    $('pauseBtn').textContent = 'Resume';
    show(`
      <div class="eyebrow">Paused</div>
      <h2>Digesting quietly</h2>
      <p>${fmt(g.mass)} digested so far as a ${STAGES[g.stage].name}, with ${g.coins.toLocaleString('en-US')} coins to spend.</p>
      <button class="go" type="button">Resume</button>
    `, resume);
  }
  function resume() {
    if (state !== 'paused') return;
    state = 'playing'; overlay.hidden = true; shopEl.hidden = false; $('pauseBtn').textContent = 'Pause';
    ensureAudio();
  }
  function gameOver(cause) {
    state = 'over';
    sfx.wilt();
    const isBest = g.mass > best;
    best = Math.max(best, g.mass);
    try { localStorage.setItem('gulper3d-best', String(best)); } catch (e) { /* storage unavailable */ }
    const titles = { war: 'The army cut it down', sting: 'Stung to death', starve: 'The Gulper starved' };
    setTimeout(() => show(`
      <div class="eyebrow">${isBest && g.mass > 0 ? 'New record' : 'Wilted'}</div>
      <h2>${titles[cause] || 'The Gulper wilted'}</h2>
      <div class="stats">
        <div><span class="label">Digested</span><strong>${fmt(g.mass)}</strong></div>
        <div><span class="label">Grew to</span><strong>${STAGES[g.stage].name}</strong></div>
        <div><span class="label">Coins earned</span><strong>${g.earned.toLocaleString('en-US')}</strong></div>
        <div><span class="label">Humans eaten</span><strong>${g.humansEaten}</strong></div>
      </div>
      <p>Best so far: ${fmt(best)}. ${g.stage < STAGES.length - 1 ? 'Next stage at ' + fmt(STAGES[g.stage + 1].at) + '.' : 'Nothing left to grow into. Only appetite.'}</p>
      <button class="go" type="button">Plant a new seed</button>
    `, startGame), 900);
  }

  // ---------- Input ----------
  const cv = renderer.domElement;
  cv.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse' || e.buttons) { mouse.x = e.clientX; mouse.y = e.clientY; }
  });
  cv.addEventListener('pointerdown', (e) => {
    if (state !== 'playing') return;
    e.preventDefault();
    mouse.x = e.clientX; mouse.y = e.clientY;
    g.snapQ = .25;
  });
  window.addEventListener('keydown', (e) => {
    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (key === ' ' && state === 'playing') { e.preventDefault(); trySnap(); return; }
    if (key === 'p' || key === 'Escape') { state === 'playing' ? pause() : resume(); return; }
    if (key === '1') return buy('meal');
    if (key === '2') return buy('swarm');
    if (key === '3') return buy('heal');
    if (key.startsWith('Arrow') && state === 'playing') e.preventDefault();
    keys[key] = true;
  });
  window.addEventListener('keyup', (e) => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  $('pauseBtn').addEventListener('click', () => (state === 'playing' ? pause() : resume()));
  $('muteBtn').addEventListener('click', (e) => {
    muted = !muted;
    e.currentTarget.textContent = muted ? 'Sound off' : 'Sound on';
    if (!muted) ensureAudio();
  });
  for (const id of Object.keys(SHOP)) shopEls[id].btn.addEventListener('click', () => buy(id));

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    camera.fov = W / H < .8 ? 62 : 50;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // ---------- Loop ----------
  let prev = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - prev) / 1000);
    prev = now;
    if (state === 'playing') update(dt, true);
    else if (state === 'title') update(dt, false);
    syncScene();
    renderer.render(scene, camera);
    if (state !== 'title') updateHUD();
    requestAnimationFrame(frame);
  }

  function boot(data) {
    try { best = Number(localStorage.getItem('gulper3d-best')) || 0; } catch (e) { best = 0; }
    best = Math.max(best, Number(data && data.best) || 0);
    resize();
    newGame();
    updateHUD();
    titleScreen();
    requestAnimationFrame(frame);
  }

  // Test hook for automated checks: jump straight to a stage
  window.__gulper = { setMass: (mg) => { if (g) { g.mass = mg; checkStage(); checkWar(); } }, state: () => g, coins: (n) => { if (g) g.coins += n; }, screenOf: (p) => toScreen(centerOf(p)) };

  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ best }));
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
